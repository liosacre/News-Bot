name: FF Weekly USD Red Folder

on:
  schedule:
    # GitHub Actions schedule uses UTC.
    # This is Sunday 13:05 UTC.
    # Depending on daylight savings, that’s usually around morning in New York (ET).
    - cron: "5 13 * * 0"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dateutil

      - name: Run script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FF_JSON_URL: ${{ secrets.FF_JSON_URL }}
        run: |
          python ff_redfolder_tomorrow.py
